name: Linux Distrobox smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distrobox-smoke:
    name: Create and inspect the real container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DBX_CONTAINER_MANAGER: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Distrobox and check Docker
        run: |
          sudo apt-get update
          sudo apt-get install --yes distrobox
          docker info
          distrobox version

      - name: Preview and create RetroCrate
        run: script -q -e -c './scripts/setup.sh --apply' /dev/null

      - name: Verify emulators and export launchers
        run: script -q -e -c './scripts/ci-smoke.sh' /dev/null
