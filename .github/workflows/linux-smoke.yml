name: Linux Distrobox smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distrobox-smoke:
    name: Create and inspect the real container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DBX_CONTAINER_MANAGER: podman
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install current stable Distrobox and Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/89luca89/distrobox/1.8.2.5/install \
            --output /tmp/distrobox-install
          sudo sh /tmp/distrobox-install --prefix /usr/local
          distrobox version
          podman info

      - name: Preview and create RetroCrate
        run: script -q -e -c './scripts/setup.sh --apply' /dev/null

      - name: Verify emulators and export launchers
        run: script -q -e -c './scripts/ci-smoke.sh' /dev/null
